name: .NET Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TMS.DeveloperTool.Blazor.slnx

      - name: Build
        run: dotnet build TMS.DeveloperTool.Blazor.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TMS.DeveloperTool.Blazor.Tests/TMS.DeveloperTool.Blazor.Tests.csproj --configuration Release --no-build --verbosity normal
